<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Geist, Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1200" height="600" rx="24" fill="#fafafa"/>
<text x="600" y="54" font-size="26" font-weight="500" fill="#18181b" text-anchor="middle">QA testing asks one question. Evals ask a different one.</text>
<rect x="60" y="100" width="510" height="440" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="84" y="136" font-size="13" font-weight="400" fill="#1100ff" text-anchor="start" letter-spacing="1.6">QA TESTING</text>
<text x="84" y="176" font-size="30" font-weight="500" fill="#18181b" text-anchor="start">Does it work?</text>
<text x="84" y="214" font-size="19" font-weight="400" fill="#71717a" text-anchor="start">One input, one expected output.</text>
<text x="84" y="242" font-size="19" font-weight="400" fill="#71717a" text-anchor="start">Pass or fail. Fix the bug, test again.</text>
<circle cx="104" cy="294" r="12" fill="#16a34a"/>
<path d="M97 294 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="130" y="300" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">Upload opens the file picker</text>
<circle cx="104" cy="346" r="12" fill="#16a34a"/>
<path d="M97 346 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="130" y="352" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">Total is saved to the catalog</text>
<circle cx="104" cy="398" r="12" fill="#16a34a"/>
<path d="M97 398 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="130" y="404" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">Wrong file type shows an error</text>
<circle cx="104" cy="450" r="12" fill="#dc2626"/>
<path d="M98 444 l12 12 M110 444 l-12 12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="130" y="456" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">Review screen loads under 2s</text>
<rect x="630" y="100" width="510" height="440" rx="14" fill="#eef0ff" stroke="#1100ff" stroke-width="2"/>
<text x="654" y="136" font-size="13" font-weight="400" fill="#1100ff" text-anchor="start" letter-spacing="1.6">EVALS</text>
<text x="654" y="176" font-size="30" font-weight="500" fill="#18181b" text-anchor="start">How well, and where does it fail?</text>
<text x="654" y="214" font-size="19" font-weight="400" fill="#71717a" text-anchor="start">Many real inputs, each with the right answer.</text>
<text x="654" y="242" font-size="19" font-weight="400" fill="#71717a" text-anchor="start">A score, a bar, and a list of weak spots.</text>
<text x="654" y="300" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">Supplier name</text>
<rect x="860" y="284" width="240" height="18" rx="9" fill="#e4e4e7"/>
<rect x="860" y="284" width="230" height="18" rx="9" fill="#16a34a"/>
<text x="1112" y="300" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">96%</text>
<text x="654" y="354" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">Invoice total</text>
<rect x="860" y="338" width="240" height="18" rx="9" fill="#e4e4e7"/>
<rect x="860" y="338" width="218" height="18" rx="9" fill="#16a34a"/>
<text x="1112" y="354" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">91%</text>
<text x="654" y="408" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">Line item quantity</text>
<rect x="860" y="392" width="240" height="18" rx="9" fill="#e4e4e7"/>
<rect x="860" y="392" width="187" height="18" rx="9" fill="#d97706"/>
<text x="1112" y="408" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">78%</text>
<text x="654" y="462" font-size="19" font-weight="400" fill="#18181b" text-anchor="start">Handwritten notes</text>
<rect x="860" y="446" width="240" height="18" rx="9" fill="#e4e4e7"/>
<rect x="860" y="446" width="101" height="18" rx="9" fill="#dc2626"/>
<text x="1112" y="462" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">42%</text>
<line x1="860" y1="282" x2="860" y2="520" stroke="#e4e4e7"/>
<line x1="1076" y1="282" x2="1076" y2="520" stroke="#1100ff" stroke-dasharray="5 5"/>
<text x="1082.0" y="296" font-size="14" font-weight="400" fill="#1100ff" text-anchor="start">bar: 90%</text>
<text x="654" y="520" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">Numbers shown are illustrative</text>
</svg>