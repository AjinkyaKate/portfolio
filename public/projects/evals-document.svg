<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="Geist, Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1200" height="580" rx="24" fill="#fafafa"/>
<text x="600" y="54" font-size="26" font-weight="500" fill="#18181b" text-anchor="middle">What goes into a one-page evals document</text>
<rect x="60" y="100" width="340" height="200" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="84" y="138" font-size="13" font-weight="400" fill="#1100ff" text-anchor="start" letter-spacing="1.6">1  PURPOSE</text>
<text x="84" y="176" font-size="22" font-weight="500" fill="#18181b" text-anchor="start">What the feature must get right</text>
<text x="84" y="210" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">One line. Read totals and line</text>
<text x="84" y="236" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">items off supplier invoices.</text>
<rect x="430" y="100" width="340" height="200" rx="14" fill="#eef0ff" stroke="#1100ff" stroke-width="2"/>
<text x="454" y="138" font-size="13" font-weight="400" fill="#1100ff" text-anchor="start" letter-spacing="1.6">2  GOLDEN SET</text>
<text x="454" y="176" font-size="22" font-weight="500" fill="#18181b" text-anchor="start">Real inputs, right answers</text>
<text x="454" y="210" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">Real invoices, real sales history.</text>
<text x="454" y="236" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">Answers typed by hand. Kept fixed.</text>
<rect x="800" y="100" width="340" height="200" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="824" y="138" font-size="13" font-weight="400" fill="#1100ff" text-anchor="start" letter-spacing="1.6">3  METRICS</text>
<text x="824" y="176" font-size="22" font-weight="500" fill="#18181b" text-anchor="start">The few numbers that matter</text>
<text x="824" y="210" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">Per-field accuracy. Forecast bias.</text>
<text x="824" y="236" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">Confident-but-wrong rate.</text>
<rect x="60" y="330" width="340" height="200" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="84" y="368" font-size="13" font-weight="400" fill="#1100ff" text-anchor="start" letter-spacing="1.6">4  THE BAR</text>
<text x="84" y="406" font-size="22" font-weight="500" fill="#18181b" text-anchor="start">Decided before the results</text>
<text x="84" y="440" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">90% on totals to ship. Under 70%</text>
<text x="84" y="466" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">on a field goes to a human</text>

<rect x="430" y="330" width="340" height="200" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="454" y="368" font-size="13" font-weight="400" fill="#1100ff" text-anchor="start" letter-spacing="1.6">5  FAILURE BUCKETS</text>
<text x="454" y="406" font-size="22" font-weight="500" fill="#18181b" text-anchor="start">Where it goes wrong, grouped</text>
<text x="454" y="440" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">Handwriting. Tilted photos. New</text>
<text x="454" y="466" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">items with no history.</text>
<rect x="800" y="330" width="340" height="200" rx="14" fill="#fff" stroke="#e4e4e7" stroke-width="1.5"/>
<text x="824" y="368" font-size="13" font-weight="400" fill="#1100ff" text-anchor="start" letter-spacing="1.6">6  CADENCE AND OWNER</text>
<text x="824" y="406" font-size="22" font-weight="500" fill="#18181b" text-anchor="start">When it runs, who reads it</text>
<text x="824" y="440" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">Every model or prompt change. PM</text>
<text x="824" y="466" font-size="17" font-weight="400" fill="#71717a" text-anchor="start">owns the set, engineering runs it.</text>
</svg>